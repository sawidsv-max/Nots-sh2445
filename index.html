<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>أفكاري</title>
<meta name="theme-color" content="#0E2A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أفكاري">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F5F0;--card:#FFFFFF;--ink:#181C1B;--ink-2:#4A524F;--ink-3:#8A928F;
  --line:#E3E0D8;--deep:#0E2A2B;--teal:#12615C;--teal-soft:#E4F0EC;
  --urgent:#B23A21;--soon:#B8862A;--later:#7B8A86;--done:#2F6B4F;--idea:#5B4B8A;
  --shadow:0 1px 2px rgba(20,30,28,.06),0 8px 24px rgba(20,30,28,.06);
  --r:14px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,Tahoma,sans-serif;font-size:15px;line-height:1.7;display:flex;flex-direction:column}
h1,h2,h3{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-weight:600}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

header{background:var(--deep);color:#F2EFE7;padding:calc(var(--safe-t) + 12px) 14px 12px;position:sticky;top:0;z-index:40}
.hrow{display:flex;align-items:center;gap:8px}
.brand{font-size:18px;font-weight:600;font-family:"Reem Kufi",sans-serif}
.brand small{display:block;font-family:"IBM Plex Sans Arabic";font-size:11px;opacity:.55;font-weight:400;margin-top:-2px}
.hspace{flex:1}
.iconbtn{width:35px;height:35px;border-radius:10px;display:grid;place-items:center;color:#F2EFE7;background:rgba(255,255,255,.09);font-size:16px;flex:none;position:relative}
.syncdot{width:7px;height:7px;border-radius:50%;background:#5C6A66;position:absolute;top:5px;left:5px}
.syncdot.ok{background:#4CAF7D}.syncdot.err{background:#D0563B}.syncdot.busy{background:#E0A93B;animation:b 1s infinite}

#drawer{position:fixed;inset:0;z-index:80;display:none}
#drawer.on{display:block}
#drawer .veil{position:absolute;inset:0;background:rgba(14,26,25,.45)}
.dpanel{position:absolute;inset-block:0;inset-inline-end:0;width:min(84%,340px);background:var(--paper);
  padding:calc(var(--safe-t) + 14px) 14px calc(20px + var(--safe-b));overflow-y:auto;box-shadow:-8px 0 40px rgba(0,0,0,.25)}
.dsec{font-size:12px;color:var(--ink-3);margin:18px 4px 8px;font-weight:600}
.ditem{display:flex;align-items:center;gap:9px;width:100%;text-align:start;padding:10px 12px;border-radius:11px;background:var(--card);border:1px solid var(--line);margin-bottom:7px;font-size:14px}
.ditem .ic{font-size:15px;opacity:.75;flex:none}
.ditem.on{background:var(--deep);color:#F2EFE7;border-color:var(--deep)}
.ditem small{margin-inline-start:auto;font-size:11px;opacity:.55;flex:none}
.ditem .x{margin-inline-start:auto;font-size:16px;opacity:.45;padding:0 6px}
.thr{flex-direction:column;align-items:stretch;gap:2px}
.thr b{font-size:13.5px;font-weight:500}
.thr span{font-size:11px;color:var(--ink-3)}

.capture{padding:12px 14px 6px}
.capbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 12px}
.capbox textarea{width:100%;border:none;background:none;resize:none;outline:none;min-height:44px;max-height:180px;line-height:1.6;padding:2px 0}
.capbox textarea::placeholder{color:var(--ink-3)}
.caprow{display:flex;align-items:center;gap:8px;padding-top:6px;border-top:1px dashed var(--line);flex-wrap:wrap}
.chipmini{font-size:12px;color:var(--ink-2);background:#F1EFE9;border-radius:999px;padding:3px 9px;border:1px solid var(--line)}
.chipmini.act{background:var(--teal-soft);border-color:#BFDDD5;color:var(--teal)}
.recOn{background:var(--urgent)!important;color:#fff!important;border-color:var(--urgent)!important;animation:b 1.2s infinite}
.send{margin-inline-start:auto;background:var(--teal);color:#fff;border-radius:10px;padding:8px 16px;font-weight:600;font-size:14px}
.send:disabled{opacity:.35}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;font-size:13px;font-weight:500;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px}
.tab .n{font-size:11px;opacity:.6;margin-inline-start:4px}
.tab[aria-selected="true"]{background:var(--deep);color:#F2EFE7;border-color:var(--deep)}
.viewrow{display:flex;gap:6px;padding:0 14px 6px}
.vbtn{flex:1;font-size:13px;padding:7px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-weight:500}
.vbtn.on{background:var(--deep);color:#F2EFE7;border-color:var(--deep)}

main{flex:1;overflow-y:auto;padding:6px 14px calc(96px + var(--safe-b));-webkit-overflow-scrolling:touch}
.pane{display:none}.pane.on{display:block}

.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px;padding:12px 14px 10px 12px;padding-inline-start:26px}
.card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:16px;
 background:radial-gradient(circle at 50% 8px,#fff 2.4px,transparent 2.6px),radial-gradient(circle at 50% 20px,#fff 2.4px,transparent 2.6px),radial-gradient(circle at 50% 32px,#fff 2.4px,transparent 2.6px),radial-gradient(circle at 50% 44px,#fff 2.4px,transparent 2.6px),radial-gradient(circle at 50% 56px,#fff 2.4px,transparent 2.6px),radial-gradient(circle at 50% 68px,#fff 2.4px,transparent 2.6px),radial-gradient(circle at 50% 80px,#fff 2.4px,transparent 2.6px),var(--rail,var(--later));
 border-start-start-radius:var(--r);border-end-start-radius:var(--r);opacity:.9}
.card.p-عاجل{--rail:var(--urgent)}.card.p-مهم{--rail:var(--soon)}
.card.p-مؤجل{--rail:var(--later)}.card.done{--rail:var(--done)}
.card.sub{margin-inline-start:18px}
.card.done .txt{text-decoration:line-through;color:var(--ink-3)}
.txt{white-space:pre-wrap;word-break:break-word;margin:0 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11.5px;border-radius:6px;padding:2px 7px;background:#F1EFE9;color:var(--ink-2);border:1px solid var(--line)}
.tag.t-فكرة{background:#EFEBF7;color:var(--idea);border-color:#DED6F0}
.tag.t-مهمة{background:var(--teal-soft);color:var(--teal);border-color:#BFDDD5}
.tag.t-تنبيه{background:#FBEFDC;color:#8A5B12;border-color:#F0DDBC}
.tag.cat{background:#E8EEF6;color:#2C4C74;border-color:#CFDDEE}
.tag.priv{background:#EFEFEF;color:#555}
.tag.date{background:none;border:none;color:var(--ink-3);padding-inline:0}
.acts{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.act{font-size:12px;color:var(--ink-2);background:#F4F2EC;border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.act.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.thumb{display:block;width:100%;max-height:190px;object-fit:cover;border-radius:9px;border:1px solid var(--line);margin-bottom:8px;background:#fff}
.aibox{margin-top:8px;padding:9px 11px;background:#FAF8F3;border:1px dashed #D9D4C6;border-radius:10px;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap}
.brief{background:linear-gradient(180deg,#F2F6F4,#FFF);border:1px solid #CFE0DA;border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.brief h3{margin:0 0 6px;font-size:15px;color:var(--teal)}
.brief .body{font-size:14px;white-space:pre-wrap;color:var(--ink-2)}
.brief .row{display:flex;gap:8px;margin-top:10px}
.followup{background:#FFF8E8;border:1px solid #F0DDB4;border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.followup h3{margin:0 0 4px;font-size:15px;color:#7A5410}
.followup p{margin:0 0 10px;font-size:13.5px;color:#8A6A2C}
.fu-actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--ink-3);padding:52px 20px}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.5}
.empty p{margin:4px 0;font-size:14px}

#mapWrap{position:relative;height:calc(100vh - 280px);min-height:320px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
#mapSvg{width:100%;height:100%;touch-action:none;display:block}
.mapbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.mlink{stroke:#C9C4B8;stroke-width:1.4}
.mlink.ai{stroke:#9C8FC4;stroke-width:2;stroke-dasharray:4 3}
.mnode{cursor:grab}
.mlabel{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:11px;fill:var(--ink-2)}

#drawWrap{position:fixed;inset:0;background:var(--paper);z-index:60;display:none;flex-direction:column}
#drawWrap.on{display:flex}
.dtop{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 8px) 12px 8px;background:var(--deep);color:#F2EFE7;flex:0 0 auto}
.dtop input{flex:1;min-width:0;background:rgba(255,255,255,.1);border:none;border-radius:9px;padding:8px 11px;color:#F2EFE7;outline:none;font-size:14px}
.canvasHolder{flex:1 1 auto;min-height:0;position:relative;background:#fff;margin:8px 10px;border-radius:12px;border:1px solid var(--line);overflow:hidden}
#pad{position:absolute;inset:0;touch-action:none;width:100%;height:100%;display:block}
.dtools{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px calc(12px + var(--safe-b));flex-wrap:wrap;background:var(--paper);border-top:1px solid var(--line)}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none}
.swatch.on{box-shadow:0 0 0 2px var(--deep)}
.sz{width:36px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.sz.on{background:var(--deep);border-color:var(--deep)}
.sz i{display:block;background:var(--ink);border-radius:50%}
.sz.on i{background:#fff}
.tbtn{font-size:13px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink-2)}
.tbtn.on{background:var(--deep);color:#F2EFE7;border-color:var(--deep)}

nav{position:fixed;bottom:0;inset-inline:0;z-index:50;background:rgba(247,245,240,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safe-b))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--ink-3);font-size:10.5px;font-weight:500}
nav button .ic{font-size:17px;line-height:1}
nav button{font-size:9.8px}
nav button.on{color:var(--deep)}

.sheet{position:fixed;inset:0;z-index:75;display:none}
.sheet.on{display:block}
.veil{position:absolute;inset:0;background:rgba(14,26,25,.42)}
.sheetInner{position:absolute;inset-inline:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + var(--safe-b));box-shadow:0 -8px 40px rgba(0,0,0,.2)}
.sheetInner h2{margin:0 0 12px;font-size:17px}
.sheetInner h3{margin:20px 0 4px;font-size:14.5px}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
label.f{display:block;font-size:12.5px;color:var(--ink-2);margin:12px 0 5px;font-weight:500}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.inp:focus{border-color:var(--teal)}
textarea.inp{min-height:90px;resize:vertical;line-height:1.6}
.btn{background:var(--deep);color:#F2EFE7;border-radius:11px;padding:11px 16px;font-weight:600;font-size:14.5px;width:100%;margin-top:14px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--urgent);border:1px solid #E8C6BC}
.btn.row{width:auto;flex:1;margin-top:0}
.rowbtns{display:flex;gap:8px;margin-top:12px}
.hint{font-size:12px;color:var(--ink-3);margin:6px 0 0;line-height:1.6}
.hint a{color:var(--teal)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}

#jrn{position:fixed;inset:0;background:var(--paper);z-index:65;display:none;flex-direction:column}
#jrn.on{display:flex}
.jtop{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 8px) 12px 8px;background:var(--deep);color:#F2EFE7;flex:0 0 auto}
.jtop input{flex:1;min-width:0;background:rgba(255,255,255,.1);border:none;border-radius:9px;padding:8px 11px;color:#F2EFE7;outline:none}
#jBody{flex:1 1 auto;min-height:0;margin:10px 12px calc(12px + var(--safe-b));padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none;resize:none;line-height:1.9;font-size:15.5px}

#rec{position:fixed;inset:0;background:var(--paper);z-index:66;display:none;flex-direction:column}
#rec.on{display:flex}
.rtop{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 8px) 12px 8px;background:var(--deep);color:#F2EFE7;flex:0 0 auto}
.rtop input{flex:1;min-width:0;background:rgba(255,255,255,.1);border:none;border-radius:9px;padding:8px 11px;color:#F2EFE7;outline:none}
.rbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.rtime{font-family:"Reem Kufi",sans-serif;font-size:44px;letter-spacing:2px;color:var(--deep)}
.rstate{margin:0;color:var(--ink-3);font-size:14px}
.recbtn{width:96px;height:96px;border-radius:50%;background:var(--urgent);color:#fff;font-size:32px;
  display:grid;place-items:center;box-shadow:0 10px 30px rgba(178,58,33,.28)}
.recbtn.rec{background:var(--deep);box-shadow:0 0 0 8px rgba(14,42,43,.12)}
.recbtn.rec #rIcon{font-size:26px}
.balgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.balcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.balcard b{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
.balcard .v{font-family:"Reem Kufi",sans-serif;font-size:19px;color:var(--deep);direction:ltr;text-align:end}
.balcard .v.neg{color:var(--urgent)}
.ftx{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px}
.ftx .amt{font-family:"Reem Kufi",sans-serif;font-size:15px;direction:ltr;margin-inline-start:auto;white-space:nowrap}
.ftx .amt.in{color:var(--done)}.ftx .amt.out{color:var(--urgent)}
.ftx small{display:block;font-size:11px;color:var(--ink-3)}
.ftbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}
.ftbl th,.ftbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:start}
.ftbl th{color:var(--ink-3);font-weight:500;font-size:12px}
.ftbl td.num{direction:ltr;text-align:end;font-family:"Reem Kufi",sans-serif}
.scoperow{display:flex;gap:6px;margin-bottom:10px}
#chatLog{padding-bottom:8px}
.msg{margin-bottom:10px;padding:11px 13px;border-radius:13px;max-width:92%;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.msg.me{background:var(--deep);color:#F2EFE7;margin-inline-start:auto;border-end-end-radius:4px}
.msg.ai{background:var(--card);border:1px solid var(--line);border-end-start-radius:4px;box-shadow:var(--shadow)}
.msg.sys{background:#FBEFDC;border:1px solid #F0DDBC;color:#7A5410;font-size:13px;max-width:100%}
.chipsrow{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chipsrow::-webkit-scrollbar{display:none}
.qchip{white-space:nowrap;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ink-2)}
.askbar{position:fixed;bottom:calc(58px + var(--safe-b));inset-inline:0;padding:8px 12px;background:rgba(247,245,240,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:none;gap:8px;align-items:flex-end;z-index:45}
.askbar.on{display:flex}
.askbar textarea{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;max-height:120px;min-height:40px;resize:none;outline:none}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-3);margin-inline-end:3px;animation:b 1s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
.toast{position:fixed;bottom:calc(74px + var(--safe-b));inset-inline:0;margin:0 auto;width:max-content;max-width:88%;background:var(--deep);color:#F2EFE7;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:95;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.on{opacity:1}

/* ===== تخطيط الأجهزة اللوحية ===== */
@media (min-width:820px){
  body{padding-inline-end:96px}
  header{padding-inline:24px}
  .brand{font-size:21px}
  .capture,.tabs,.viewrow{max-width:1080px;margin-inline:auto;padding-inline:24px;width:100%}
  main{max-width:1080px;margin-inline:auto;width:100%;padding:8px 24px 40px}
  .capbox textarea{min-height:56px;font-size:16px}
  /* شريط جانبي بدل الشريط السفلي */
  nav{top:0;bottom:0;inset-inline-end:0;inset-inline-start:auto;width:96px;
      flex-direction:column;justify-content:center;gap:6px;border-top:none;
      border-inline-start:1px solid var(--line);padding:12px 8px;background:rgba(247,245,240,.96)}
  nav button{flex:0 0 auto;padding:12px 0;border-radius:12px;font-size:11.5px}
  nav button .ic{font-size:21px;margin-bottom:2px}
  nav button.on{background:var(--deep);color:#F2EFE7}
  /* بطاقات في عمودين */
  #paneNotes{column-count:2;column-gap:14px}
  #paneNotes>*{break-inside:avoid;-webkit-column-break-inside:avoid}
  #paneJournal,#paneMeet,#paneBoards{column-count:2;column-gap:14px}
  #paneJournal>*,#paneMeet>*,#paneBoards>*{break-inside:avoid}
  #paneJournal>.btn,#paneMeet>.btn{column-span:all}
  .balgrid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  /* اللوحات المنبثقة كنوافذ وسط الشاشة */
  .sheetInner{inset-inline:auto;inset-inline-start:50%;transform:translateX(-50%);bottom:auto;top:50%;
    margin-top:-42vh;width:min(680px,92%);max-height:84vh;border-radius:18px}
  .askbar{bottom:0;inset-inline-end:96px;inset-inline-start:0;padding:12px 24px}
  .toast{bottom:28px;inset-inline-end:96px}
  #mapWrap{height:calc(100vh - 300px)}
  .dpanel{width:400px}
  /* لوحة الرسم بمساحة أكبر */
  .canvasHolder{margin:12px 18px}
  .dtools{padding:10px 18px 16px;gap:10px}
  .swatch{width:34px;height:34px}
  .sz{width:42px;height:36px}
  .tbtn{font-size:14px;padding:9px 16px}
  #drawWrap,#jrn,#rec{inset-inline-end:96px}
  #jBody{margin:14px 18px;font-size:16.5px;line-height:2}
}
@media (min-width:1200px){
  #paneNotes{column-count:3}
}
</style>
</head>
<body>

<script>
/* ===== التخزين ===== */
const mem={};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
let notes=store.get('afk_notes',[]), boards=store.get('afk_boards',[]),
    journals=store.get('afk_journals',[]), threads=store.get('afk_threads',[]),
    meetings=store.get('afk_meetings',[]),
    deleted=store.get('afk_deleted',[]), mapData=store.get('afk_map',null),
    brief=store.get('afk_brief',{date:'',text:''}),
    prof=store.get('afk_prof',{summary:'',projects:[],goals:[],people:[],style:'',at:0}),
    settings=store.get('afk_settings',{provider:'gemini',key:'',model:'',fast:'',autoAI:false,web:false,
             autoBrief:true,gh:{token:'',repo:'',last:0},autoSync:true});
if(!settings.gh)settings.gh={token:'',repo:'',last:0};
let curThread=threads[0]?threads[0].id:null;

const saveLocal=()=>{store.set('afk_notes',notes);store.set('afk_boards',boards);store.set('afk_journals',journals);
  store.set('afk_threads',threads);store.set('afk_meetings',meetings);store.set('afk_deleted',deleted);store.set('afk_prof',prof)};
const saveSettings=()=>store.set('afk_settings',settings);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400)}
function save(){saveLocal();queueSync()}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* ===== التصنيف المحلي ===== */
const KW={مهمة:['لازم','يجب','محتاج','عاوز','عايز','اعمل','أعمل','جهز','أجهز','حضر','كلم','أكلم','اتصل','ابعت','ارسل','أرسل','راجع','تابع','خلص','اشتري','ادفع','احجز','صور','ركب','سلم','ارفع','اطلب','قدم','وقع','جدد','اجتماع','موعد'],
 تنبيه:['ذكرني','لا تنسى','متنساش','تذكير','انتبه','خلي بالك','ينتهي','آخر موعد','مهلة'],
 فكرة:['فكرة','لو عملنا','ممكن نعمل','اقتراح','مشروع','تخيل','ماذا لو','إيه رأيك','ايه رأيك','نطور','نبتكر','رؤية','تصور','حلم','خطة']};
const URGENT=['عاجل','النهاردة','اليوم','حالا','حالاً','فورا','فوراً','بسرعة','ضروري','مستعجل','بكرة','غدا','غداً','الليلة','دلوقتي'];
const LATER=['بعدين','لاحقا','لاحقاً','مستقبلا','مستقبلاً','قريبا','قريباً','يوم ما','مش مستعجل','السنة الجاية'];
function classify(text){
  const t=' '+text.toLowerCase()+' ';let type='ملاحظة';
  for(const k of KW.تنبيه)if(t.includes(k)){type='تنبيه';break}
  if(type==='ملاحظة')for(const k of KW.مهمة)if(t.includes(k)){type='مهمة';break}
  if(type==='ملاحظة')for(const k of KW.فكرة)if(t.includes(k)){type='فكرة';break}
  let priority=(type==='فكرة'||type==='ملاحظة')?'مؤجل':'مهم';
  for(const k of LATER)if(t.includes(k)){priority='مؤجل';break}
  for(const k of URGENT)if(t.includes(k)){priority='عاجل';break}
  return{type,priority,tags:(text.match(/#[\u0621-\u064A\w-]+/g)||[]).map(s=>s.slice(1)),links:text.match(/https?:\/\/[^\s]+/g)||[]};
}
function addNote(text,ex={}){
  text=(text||'').trim();if(!text)return null;
  const c=classify(text);
  const n={id:uid(),text,type:ex.type||c.type,priority:ex.priority||c.priority,status:'open',
    tags:c.tags,links:c.links,cat:ex.cat||'',private:!!ex.private,boardId:ex.boardId||null,
    parent:ex.parent||null,src:ex.src||null,ai:'',createdAt:Date.now(),updatedAt:Date.now(),doneAt:null};
  notes.unshift(n);return n;
}

/* ===== مزامنة GitHub ===== */
function b64enc(str){const b=new TextEncoder().encode(str);let s='';
  for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b){return new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)))}
const ghReady=()=>!!(settings.gh.token&&settings.gh.repo);
const setDot=s=>$('#sdot').className='syncdot'+(s?' '+s:'');
const ghApi=(p,o={})=>fetch(`https://api.github.com/repos/${settings.gh.repo}/contents/${p}`,
  {...o,headers:{'Authorization':'Bearer '+settings.gh.token,'Accept':'application/vnd.github+json','Content-Type':'application/json',...(o.headers||{})}});
async function ghRead(f){const r=await ghApi(f);if(r.status===404)return{data:null,sha:null};
  if(!r.ok)throw new Error((await r.json()).message||'خطأ '+r.status);
  const j=await r.json();return{data:JSON.parse(b64dec(j.content)),sha:j.sha}}
async function ghWrite(f,obj,sha){const r=await ghApi(f,{method:'PUT',body:JSON.stringify({
  message:'afkary '+new Date().toISOString(),content:b64enc(JSON.stringify(obj)),...(sha?{sha}:{})})});
  if(!r.ok)throw new Error((await r.json()).message||'فشل الرفع')}
function mergeById(mine,theirs){
  const m=new Map();
  [...theirs,...mine].forEach(x=>{const o=m.get(x.id);
    if(!o||(x.updatedAt||x.createdAt||0)>=(o.updatedAt||o.createdAt||0))m.set(x.id,x)});
  const gone=new Set(deleted.map(d=>d.id));
  return[...m.values()].filter(x=>!gone.has(x.id)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}
let syncing=false,syncTimer=null;
function queueSync(){if(!ghReady()||!settings.autoSync)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(true),20000)}
async function syncNow(quiet){
  if(!ghReady()){if(!quiet)openSettings('اربط المزامنة أولاً');return}
  if(syncing)return;syncing=true;setDot('busy');
  try{
    const m=await ghRead('afkary-data.json');
    if(m.data){
      notes=mergeById(notes,m.data.notes||[]);
      journals=mergeById(journals,m.data.journals||[]);
      threads=mergeById(threads,m.data.threads||[]);
      meetings=mergeById(meetings,m.data.meetings||[]);
      deleted=[...new Map([...(m.data.deleted||[]),...deleted].map(d=>[d.id,d])).values()];
      if(m.data.prof&&(m.data.prof.at||0)>(prof.at||0))prof=m.data.prof;
    }
    await ghWrite('afkary-data.json',{v:3,notes,journals,threads,meetings,deleted,prof,at:Date.now()},m.sha);
    const fb=store.get('afk_fin',null);
    if(fb){
      const rf=await ghRead('afkary-fin.json');
      if(rf.data&&(rf.data.at||0)>(fb.at||0)){store.set('afk_fin',rf.data);finLoaded=false;finKey=null}
      else await ghWrite('afkary-fin.json',fb,rf.sha);
    }
    if(boards.length){const b=await ghRead('afkary-boards.json');
      if(b.data)boards=mergeById(boards,b.data.boards||[]);
      await ghWrite('afkary-boards.json',{v:3,boards,at:Date.now()},b.sha)}
    settings.gh.last=Date.now();saveSettings();saveLocal();setDot('ok');renderAll();
    if(!quiet)toast('تمت المزامنة');
  }catch(e){setDot('err');if(!quiet)toast('فشلت المزامنة: '+e.message)}
  finally{syncing=false}
}
$('#btnSync').onclick=()=>syncNow(false);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ghReady()&&settings.autoSync)syncNow(true)});

/* ===== القائمة الجانبية ===== */
const catList=()=>[...new Set(notes.map(n=>n.cat).filter(Boolean))];
function openDrawer(){
  const cats=catList();
  $('#dpanel').innerHTML=`
   <div class="dsec">الأقسام</div>
   <button class="ditem" data-go="notes"><span class="ic">▤</span>الأفكار<small>${notes.filter(n=>n.status!=='done').length}</small></button>
   <button class="ditem" data-go="journal"><span class="ic">✒</span>المذكرات<small>${journals.length}</small></button>
   <button class="ditem" data-go="meet"><span class="ic">🎙</span>الاجتماعات<small>${meetings.length}</small></button>
   <button class="ditem" data-go="fin"><span class="ic">₪</span>المالية</button>
   <button class="ditem" data-go="boards"><span class="ic">◫</span>الرسومات<small>${boards.length}</small></button>
   <button class="ditem" data-go="settings"><span class="ic">⚙</span>الإعدادات</button>
   <div class="dsec">المحادثات</div>
   <button class="ditem" id="newThread"><span class="ic">＋</span>محادثة جديدة</button>
   ${threads.length?threads.slice(0,20).map(t=>`<button class="ditem thr ${curThread===t.id?'on':''}" data-thr="${t.id}">
     <b>${esc(t.title||'محادثة')}</b><span>${fmtDate(t.updatedAt||t.createdAt)} · ${t.msgs.length} رسالة</span></button>`).join('')
     :'<p class="hint" style="margin-inline:4px">لا محادثات بعد</p>'}
   <div class="dsec">التصنيفات</div>
   ${cats.length?cats.map(c=>`<button class="ditem" data-cat="${esc(c)}"><span class="ic">◆</span>${esc(c)}
     <small>${notes.filter(n=>n.cat===c&&n.status!=='done').length}</small><span class="x" data-catedit="${esc(c)}">⋯</span></button>`).join('')
     :'<p class="hint" style="margin-inline:4px">لا تصنيفات — استخدم «رتّبها بالذكاء» أو زر «تصنيف»</p>'}
   <div class="dsec">أدوات</div>
   <button class="ditem" id="dBrief"><span class="ic">☀</span>الموجز الصباحي</button>
   <button class="ditem" id="dSync"><span class="ic">⇅</span>زامن الآن<small>${settings.gh.last?fmtDate(settings.gh.last):'—'}</small></button>
   <button class="ditem" id="dProfile"><span class="ic">☺</span>ملف شخصيتي</button>`;
  $('#drawer').classList.add('on');
}
$('#btnMenu').onclick=openDrawer;
$('#drawer').addEventListener('click',e=>{
  if(e.target.dataset.dclose!==undefined)return $('#drawer').classList.remove('on');
  const ce=e.target.closest('[data-catedit]');
  if(ce){$('#drawer').classList.remove('on');return editCat(ce.dataset.catedit)}
  const g=e.target.closest('[data-go]');
  if(g){$('#drawer').classList.remove('on');return g.dataset.go==='settings'?openSettings():go(g.dataset.go)}
  const c=e.target.closest('[data-cat]');
  if(c){tab='cat:'+c.dataset.cat;$('#drawer').classList.remove('on');return go('notes')}
  const t=e.target.closest('[data-thr]');
  if(t){curThread=t.dataset.thr;$('#drawer').classList.remove('on');return go('chat')}
  if(e.target.closest('#newThread')){curThread=null;$('#drawer').classList.remove('on');return go('chat')}
  if(e.target.closest('#dSync')){$('#drawer').classList.remove('on');return syncNow(false)}
  if(e.target.closest('#dBrief')){$('#drawer').classList.remove('on');return runBrief(true)}
  if(e.target.closest('#dProfile')){$('#drawer').classList.remove('on');return openProfile()}
});
function editCat(c){
  openSheet(`<h2>التصنيف: ${esc(c)}</h2>
   <label class="f">إعادة تسمية</label><input class="inp" id="cName" value="${esc(c)}">
   <div class="rowbtns"><button class="btn row danger" id="cDel">احذف التصنيف</button>
   <button class="btn row" id="cSave">حفظ</button></div>
   <p class="hint">الحذف يزيل التصنيف عن الملاحظات ولا يحذفها.</p>`);
  $('#cSave').onclick=()=>{const v=$('#cName').value.trim();
    notes.forEach(n=>{if(n.cat===c){n.cat=v;n.updatedAt=Date.now()}});save();$('#sheet').classList.remove('on');renderAll()};
  $('#cDel').onclick=()=>{notes.forEach(n=>{if(n.cat===c){n.cat='';n.updatedAt=Date.now()}});
    if(tab==='cat:'+c)tab='all';save();$('#sheet').classList.remove('on');renderAll()};
}
function openProfile(){
  openSheet(`<h2>ملف شخصيتي</h2>
   <p class="hint">يبنيه المساعد من تحليلاتك ومذكراتك، ويُستخدم في كل رد. عدّله كما تشاء.</p>
   <label class="f">الخلاصة</label><textarea class="inp" id="pSum">${esc(prof.summary)}</textarea>
   <label class="f">المشاريع (سطر لكل مشروع)</label><textarea class="inp" id="pPrj">${esc((prof.projects||[]).join('\n'))}</textarea>
   <label class="f">الأهداف</label><textarea class="inp" id="pGoal">${esc((prof.goals||[]).join('\n'))}</textarea>
   <label class="f">أشخاص متكررون</label><textarea class="inp" id="pPpl">${esc((prof.people||[]).join('\n'))}</textarea>
   <label class="f">أسلوبك في العمل والقرار</label><textarea class="inp" id="pStyle">${esc(prof.style)}</textarea>
   <button class="btn" id="pSave">حفظ</button>`);
  $('#pSave').onclick=()=>{const L=v=>v.split('\n').map(s=>s.trim()).filter(Boolean);
    prof={summary:$('#pSum').value.trim(),projects:L($('#pPrj').value),goals:L($('#pGoal').value),
      people:L($('#pPpl').value),style:$('#pStyle').value.trim(),at:Date.now()};
    save();$('#sheet').classList.remove('on');toast('اتحفظ ملف شخصيتك')};
}

/* ===== العرض ===== */
const TABS=[{id:'all',label:'الكل',f:n=>n.status!=='done'},
 {id:'urgent',label:'عاجل',f:n=>n.status!=='done'&&n.priority==='عاجل'},
 {id:'now',label:'قيد التنفيذ',f:n=>n.status!=='done'&&n.priority==='مهم'},
 {id:'later',label:'مؤجل',f:n=>n.status!=='done'&&n.priority==='مؤجل'},
 {id:'ideas',label:'أفكار',f:n=>n.status!=='done'&&n.type==='فكرة'},
 {id:'links',label:'روابط',f:n=>n.links&&n.links.length},
 {id:'done',label:'منجز',f:n=>n.status==='done'}];
let tab='all',query='',view='cards';
function fmtDate(ts){const d=Math.floor((Date.now()-ts)/86400000);
  if(d===0)return'اليوم';if(d===1)return'أمس';if(d<7)return`منذ ${d} أيام`;
  return new Date(ts).toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab" data-tab="${t.id}" aria-selected="${tab===t.id}">${t.label}<span class="n">${notes.filter(t.f).length}</span></button>`).join('')
   +catList().map(c=>`<button class="tab" data-tab="cat:${esc(c)}" aria-selected="${tab==='cat:'+c}">${esc(c)}<span class="n">${notes.filter(n=>n.cat===c&&n.status!=='done').length}</span></button>`).join('');
}
function currentList(){
  if(query){const q=query.trim().toLowerCase();
    return notes.filter(n=>n.text.toLowerCase().includes(q)||n.tags.join(' ').includes(q)||(n.cat||'').includes(q))}
  if(tab.startsWith('cat:'))return notes.filter(n=>n.cat===tab.slice(4)&&n.status!=='done');
  return notes.filter(TABS.find(x=>x.id===tab).f);
}
function noteCard(n){
  const b=n.boardId?boards.find(x=>x.id===n.boardId):null;

let mnodes=[],mlinks=[],vb={x:0,y:0,w:800,h:600};
const COLOR={'فكرة':'#5B4B8A','مهمة':'#12615C','تنبيه':'#B8862A','ملاحظة':'#4A524F'};
function buildGraph(){
  const list=notes.filter(n=>n.status!=='done').slice(0,45);
  mnodes=list.map((n,i)=>({id:n.id,label:n.text.slice(0,24),type:n.type,
    r:n.priority==='عاجل'?26:n.priority==='مهم'?22:18,
    x:400+Math.cos(i/Math.max(list.length,1)*6.28)*220+(Math.random()*40-20),
    y:300+Math.sin(i/Math.max(list.length,1)*6.28)*180+(Math.random()*40-20),vx:0,vy:0}));
  const idx=Object.fromEntries(mnodes.map((n,i)=>[n.id,i]));
  mlinks=[];const byCat={};
  list.forEach(n=>{const k=n.cat||('نوع:'+n.type);(byCat[k]=byCat[k]||[]).push(n.id)});
  Object.values(byCat).forEach(ids=>{for(let i=1;i<ids.length;i++)mlinks.push({a:idx[ids[i-1]],b:idx[ids[i]],ai:false})});
  if(mapData&&mapData.links)mapData.links.forEach(([a,b])=>{if(idx[a]!==undefined&&idx[b]!==undefined)mlinks.push({a:idx[a],b:idx[b],ai:true})});
  simulate(320);
}
function simulate(steps){
  for(let s=0;s<steps;s++){
    for(let i=0;i<mnodes.length;i++){const a=mnodes[i];
      for(let j=i+1;j<mnodes.length;j++){const b=mnodes[j];
        const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy||1,d=Math.sqrt(d2),f=2600/d2;
        a.vx-=dx/d*f;a.vy-=dy/d*f;b.vx+=dx/d*f;b.vy+=dy/d*f}
      a.vx+=(400-a.x)*.0016;a.vy+=(300-a.y)*.0016}
    mlinks.forEach(l=>{const a=mnodes[l.a],b=mnodes[l.b];if(!a||!b)return;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-115)*.012;
      a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f});
    mnodes.forEach(n=>{if(n.held){n.vx=0;n.vy=0;return}n.x+=n.vx*=.82;n.y+=n.vy*=.82})}
}
function renderMap(){
  if(!mnodes.length)buildGraph();
  const svg=$('#mapSvg');
  if(!mnodes.length){svg.innerHTML='';return}
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.innerHTML=mlinks.map(l=>{const a=mnodes[l.a],b=mnodes[l.b];if(!a||!b)return'';
    return`<line class="mlink ${l.ai?'ai':''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`}).join('')
   +mnodes.map((n,i)=>`<g class="mnode" data-i="${i}" data-id="${n.id}">
     <circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${COLOR[n.type]||'#4A524F'}" opacity=".92"/>
     <text class="mlabel" x="${n.x}" y="${n.y+n.r+13}" text-anchor="middle">${esc(n.label)}</text></g>`).join('');
}
(function(){const svg=$('#mapSvg');let drag=null,pan=null;
  const toSvg=e=>{const r=svg.getBoundingClientRect();
    return{x:vb.x+(e.clientX-r.left)/r.width*vb.w,y:vb.y+(e.clientY-r.top)/r.height*vb.h}};
  svg.addEventListener('pointerdown',e=>{const g=e.target.closest('.mnode'),p=toSvg(e);
    if(g){const i=+g.dataset.i;mnodes[i].held=true;drag={i,id:g.dataset.id,moved:false}}else pan=p;
    svg.setPointerCapture(e.pointerId)});
  svg.addEventListener('pointermove',e=>{const p=toSvg(e);
    if(drag){const n=mnodes[drag.i];n.x=p.x;n.y=p.y;drag.moved=true;renderMap()}
    else if(pan){vb.x-=p.x-pan.x;vb.y-=p.y-pan.y;renderMap()}});
  svg.addEventListener('pointerup',()=>{if(drag){mnodes[drag.i].held=false;
    if(!drag.moved){const n=notes.find(x=>x.id===drag.id);if(n)openNote(n)}}drag=null;pan=null});
  $('#mapIn').onclick=()=>{vb.w*=.8;vb.h*=.8;renderMap()};
  $('#mapOut').onclick=()=>{vb.w/=.8;vb.h/=.8;renderMap()};
  $('#mapReset').onclick=()=>{vb={x:0,y:0,w:800,h:600};mnodes=[];renderMap()};
})();
$('#mapAI').onclick=async e=>{
  if(!settings.key)return openSettings('يحتاج مفتاحاً');
  const list=notes.filter(n=>n.status!=='done'&&!n.private).slice(0,45);
  if(list.length<3)return toast('محتاج ملاحظات أكتر');
  e.target.textContent='…';
  try{
    const out=await callAI({deep:true,
      system:'اقرأ الملاحظات المرقّمة وأخرج JSON فقط: {"clusters":[{"name":"اسم المحور","ids":[1,2]}],"links":[[1,5]]}. links للأفكار المتباعدة التي بينها رابط حقيقي مفيد.',
      prompt:list.map((n,i)=>`${i+1}. [${n.type}] ${n.text}`).join('\n'),max:1400});
    const j=JSON.parse(out.replace(/```json|```/g,'').trim());
    mapData={links:(j.links||[]).map(([a,b])=>[list[a-1]&&list[a-1].id,list[b-1]&&list[b-1].id]).filter(p=>p[0]&&p[1]),
      clusters:(j.clusters||[]).map(c=>({name:c.name,ids:(c.ids||[]).map(i=>list[i-1]&&list[i-1].id).filter(Boolean)}))};
    store.set('afk_map',mapData);mnodes=[];renderMap();
    if(mapData.clusters.length)suggestCats(mapData.clusters);
  }catch(err){toast('تعذّر: '+err.message)}
  e.target.textContent='✦ رتّبها بالذكاء';
};
function suggestCats(cl){
  openSheet(`<h2>تصنيفات مقترحة</h2><p class="hint">اختر ما يعجبك ليُطبَّق.</p>
   ${cl.map((c,i)=>`<div class="box"><label style="display:flex;gap:10px;align-items:center">
     <input type="checkbox" class="cbx" data-i="${i}" checked style="width:18px;height:18px">
     <b>${esc(c.name)}</b><span class="hint" style="margin:0">${c.ids.length} ملاحظة</span></label></div>`).join('')}
   <button class="btn" id="applyCats">طبّق المختار</button>`);
  $('#applyCats').onclick=()=>{let k=0;
    $$('.cbx').forEach(cb=>{if(!cb.checked)return;const c=cl[+cb.dataset.i];
      c.ids.forEach(id=>{const n=notes.find(x=>x.id===id);if(n){n.cat=c.name;n.updatedAt=Date.now();k++}})});

}

function submitCap(){
  const n=addNote(cap.value,{type:capType,private:capPriv});if(!n)return;
  cap.value='';cap.style.height='auto';$('#capSend').disabled=true;
  save();mnodes=[];renderNotes();
  if(settings.autoAI&&settings.key&&!n.private)refineWithAI(n);
}
async function refineWithAI(n){
  try{const cats=catList();
    const out=await callAI({system:`صنّف الملاحظة العربية. JSON فقط: {"type":"فكرة|مهمة|ملاحظة|تنبيه","priority":"عاجل|مهم|مؤجل","cat":"تصنيف"}${cats.length?'. التصنيفات المتاحة: '+cats.join('، ')+'. استخدم واحداً إن ناسب وإلا اقترح جديداً قصيراً.':''}`,
      prompt:n.text,max:150});
    const j=JSON.parse(out.replace(/```json|```/g,'').trim());
    if(j.type)n.type=j.type;if(j.priority)n.priority=j.priority;if(j.cat)n.cat=j.cat;
    n.updatedAt=Date.now();save();renderNotes()}catch(e){}
}

$('#paneNotes').addEventListener('click',e=>{
  if(e.target.id==='briefHide'){brief.text='';store.set('afk_brief',brief);renderNotes();return}
  if(e.target.id==='briefChat'){newThread('موجز '+new Date().toLocaleDateString('ar-EG'),brief.text);go('chat');return}
  const fu=e.target.closest('[data-fu]');
  if(fu){const n=notes.find(x=>x.id===fu.closest('.followup').dataset.id);if(!n)return;
    const a=fu.dataset.fu;
    if(a==='done'){n.status='done';n.doneAt=Date.now()}
    if(a==='drop')n.priority='مؤجل';
    n.updatedAt=Date.now();save();renderNotes();return}
  const btn=e.target.closest('.act');if(!btn)return;
  const n=notes.find(x=>x.id===btn.closest('.card').dataset.id);if(!n)return;
  const a=btn.dataset.a;
  if(a==='edit')return editNote(n);
  if(a==='cat')return pickCat(n);
  if(a==='break')return breakDown(n,btn);
  if(a==='ai')return analyzeOne(n,btn);
  if(a==='done'){n.status=n.status==='done'?'open':'done';n.doneAt=n.status==='done'?Date.now():null;n.updatedAt=Date.now()}
  if(a==='cycle'){const o=['عاجل','مهم','مؤجل'];n.priority=o[(o.indexOf(n.priority)+1)%3];n.updatedAt=Date.now()}
  if(a==='del'){if(confirm('حذف هذه الملاحظة؟')){notes=notes.filter(x=>x.id!==n.id);deleted.push({id:n.id,at:Date.now()})}}
  save();mnodes=[];renderNotes();
});

   ${cats.length?`<label class="f">تصنيف موجود</label><div class="mapbar">${cats.map(c=>`<button class="act" data-pc="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
   <label class="f">أو جديد</label><input class="inp" id="newCat" value="${esc(n.cat||'')}" placeholder="مثال: كورسات التدريب">
   <div class="rowbtns"><button class="btn row sec" id="clearCat">بلا تصنيف</button><button class="btn row" id="saveCat">حفظ</button></div>`);
  $('#sheetBody').addEventListener('click',e=>{const b=e.target.closest('[data-pc]');if(!b)return;
    n.cat=b.dataset.pc;n.updatedAt=Date.now();save();$('#sheet').classList.remove('on');renderAll()});
  $('#saveCat').onclick=()=>{n.cat=$('#newCat').value.trim();n.updatedAt=Date.now();save();$('#sheet').classList.remove('on');renderAll()};
  $('#clearCat').onclick=()=>{n.cat='';n.updatedAt=Date.now();save();$('#sheet').classList.remove('on');renderAll()};

async function analyzeOne(n,btn){
  if(n.private)return toast('ملاحظة خاصة — لا تُرسل');
  if(!settings.key)return openSettings('أضف مفتاحاً أولاً');
  const old=btn.textContent;btn.textContent='…';
  try{n.ai=await callAI({deep:true,
    system:`أنت مساعد تنفيذي عربي.\n${profText()}\nحلّل الملاحظة باختصار: جوهرها، أول خطوة عملية واحدة، وتحذير واحد إن وُجد. ٣ أسطر بلا مقدمات.`,
    prompt:n.text,max:400});
    n.updatedAt=Date.now();save();$('#sheet').classList.remove('on');renderNotes()}
  catch(err){btn.textContent=old;toast('تعذّر: '+err.message)}
}
async function breakDown(n,btn){
  if(n.private)return toast('ملاحظة خاصة — لا تُرسل');
  if(!settings.key)return openSettings('أضف مفتاحاً أولاً');
  const old=btn.textContent;btn.textContent='…';
  try{
    const out=await callAI({deep:true,
      system:`حوّل الفكرة إلى خطوات تنفيذ عملية مرتبة.\n${profText()}\nأجب JSON فقط: {"steps":[{"text":"الخطوة","priority":"عاجل|مهم|مؤجل"}]} من ٣ إلى ٧ خطوات، كل خطوة فعل واضح قابل للتنفيذ.`,
      prompt:n.text,max:900});
    const j=JSON.parse(out.replace(/```json|```/g,'').trim());
    const steps=(j.steps||[]).slice(0,8);
    if(!steps.length)throw new Error('لم تُستخرج خطوات');
    openSheet(`<h2>خطوات التنفيذ</h2><div class="box">${esc(n.text.slice(0,120))}</div>

let fin={txs:[],plans:[],accounts:['بنك','كاش','الصرافة'],updatedAt:0};
let finKey=null, finLoaded=false;
const CURS=['SAR','EGP','USD'];
const CURN={SAR:'ريال',EGP:'جنيه',USD:'دولار'};
let finScope='الكل';

/* --- تشفير --- */
const enc=new TextEncoder(), dec=new TextDecoder();
const bufB64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const b64Buf=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function finEncrypt(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},finKey,enc.encode(JSON.stringify(obj)));
  return {v:1,iv:bufB64(iv),ct:bufB64(ct),salt:store.get('afk_fin_salt',''),at:Date.now()};
}
async function finDecrypt(blob){
  const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64Buf(blob.iv)},finKey,b64Buf(blob.ct));
  return JSON.parse(dec.decode(data));
}
async function finSave(){
  fin.updatedAt=Date.now();
  if(finKey){ store.set('afk_fin',await finEncrypt(fin)); }
  else { store.set('afk_fin',{plain:fin,at:Date.now()}); }
  queueSync();
}
async function finUnlock(pass){
  let salt=store.get('afk_fin_salt','');
  if(!salt){ const s=crypto.getRandomValues(new Uint8Array(16)); salt=bufB64(s); store.set('afk_fin_salt',salt); }
  finKey=await deriveKey(pass,b64Buf(salt));
  const blob=store.get('afk_fin',null);
  if(blob&&blob.ct){ fin=await finDecrypt(blob); }
  finLoaded=true;
}
function finGate(){
  const blob=store.get('afk_fin',null);
  if(blob&&blob.plain){fin=blob.plain;finLoaded=true;return renderFin()}
  const first=!blob;

   <label class="f">كلمة السر</label><input class="inp" id="finPass" type="password" autocomplete="off">

   ${first?'<button class="btn sec" id="finSkip">بلا تشفير (غير مستحسن)</button>':''}`);

    catch(e){ toast('كلمة السر غير صحيحة'); }
  };
  if(first)$('#finSkip').onclick=()=>{finKey=null;finLoaded=true;$('#sheet').classList.remove('on');finSave();renderFin()};
}

/* --- تحليل الجملة محلياً --- */
const AR_DIG={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
function normNum(t){return t.replace(/[٠-٩]/g,d=>AR_DIG[d]).replace(/,/g,'')}
function parseFin(raw){
  let t=normNum(' '+raw+' ');
  let at=Date.now(), hasDate=false;
  /* 1) وقت صريح 10:30 — يُزال قبل قراءة المبلغ */
  let hh=null,mm=null;
  const tm=t.match(/(\d{1,2})\s*:\s*(\d{2})/);
  if(tm){hh=+tm[1];mm=+tm[2];if(/م\b|مساء|بعد الضهر|بعد الظهر/.test(t)&&hh<12)hh+=12;t=t.replace(tm[0],' ')}
  /* 2) تاريخ صريح 2026/8/15 أو 15-8-2026 */
  const dm=t.match(/(\d{1,4})\s*[\/\-\.]\s*(\d{1,2})\s*[\/\-\.]\s*(\d{1,4})/);
  if(dm){
    let a=+dm[1],b=+dm[2],c=+dm[3],y,mo,d;
    if(a>31){y=a;mo=b;d=c}else{d=a;mo=b;y=c<100?2000+c:c}
    const dt=new Date(y,(mo||1)-1,d||1);
    if(!isNaN(dt.getTime())){const n=new Date();dt.setHours(hh!==null?hh:n.getHours(),mm!==null?mm:n.getMinutes());
      at=dt.getTime();hasDate=true}
    t=t.replace(dm[0],' ');
  }
  /* 3) تواريخ نسبية */
  if(!hasDate){
    const dAgo=t.match(/(?:من|قبل)\s*(\d+)\s*(?:يوم|أيام|ايام)/);
    const wAgo=t.match(/(?:من|قبل)\s*(\d+)\s*(?:أسبوع|اسبوع|أسابيع|اسابيع)/);
    if(dAgo){at-=+dAgo[1]*86400000;t=t.replace(dAgo[0],' ');hasDate=true}
    else if(wAgo){at-=+wAgo[1]*7*86400000;t=t.replace(wAgo[0],' ');hasDate=true}
    else if(/(?:من|قبل)\s*يومين|أول امبارح|اول امبارح|أول أمس|اول امس/.test(t)){
      at-=2*86400000;t=t.replace(/(?:من|قبل)\s*يومين|أول امبارح|اول امبارح|أول أمس|اول امس/,' ');hasDate=true}
    else if(/(?:من|قبل)\s*أسبوعين|(?:من|قبل)\s*اسبوعين/.test(t)){at-=14*86400000;hasDate=true}
    else if(/امبارح|أمس|البارحة|امس/.test(t)){at-=86400000;hasDate=true}
    else if(/الأسبوع الماضي|الاسبوع الماضي|الأسبوع اللي فات|الاسبوع اللي فات/.test(t)){at-=7*86400000;hasDate=true}
    else if(/الشهر الماضي|الشهر اللي فات/.test(t)){const d=new Date();d.setMonth(d.getMonth()-1);at=d.getTime();hasDate=true}
  }
  if(!hasDate&&hh!==null){const d=new Date();d.setHours(hh,mm||0,0,0);at=d.getTime()}
  /* 4) المبلغ — الرقم الملاصق للعملة له الأولوية */
  let amount=null;
  const m1=t.match(/(\d+(?:\.\d+)?)\s*(?:ريال|ر\.س|جنيه|ج\.م|دولار|\$|sar|egp|usd)/i);
  const m2=t.match(/(?:ريال|ر\.س|جنيه|ج\.م|دولار|\$|sar|egp|usd)\s*(\d+(?:\.\d+)?)/i);
  const m3=t.match(/(\d+(?:\.\d+)?)/);
  if(m1)amount=parseFloat(m1[1]); else if(m2)amount=parseFloat(m2[1]); else if(m3)amount=parseFloat(m3[1]);
  if(amount===null||isNaN(amount))return null;
  if(/ألف|الف|آلاف/.test(t))amount*=1000;
  if(/مليون/.test(t))amount*=1000000;
  /* كسور منطوقة */
  if(Number.isInteger(amount)){
    const WORDS={'عشرة':10,'عشره':10,'عشرين':20,'خمسة وعشرين':25,'خمسه وعشرين':25,'خمس وعشرين':25,
      'ثلاثين':30,'تلاتين':30,'أربعين':40,'اربعين':40,'خمسين':50,'ستين':60,'سبعين':70,
      'خمسة وسبعين':75,'خمسه وسبعين':75,'خمس وسبعين':75,'ثمانين':80,'تمانين':80,'تسعين':90,'خمسة':5,'خمسه':5};
    const sub=t.match(/و\s*(\d{1,2})\s*(?:هللة|هلله|هللات|قرش|قروش|سنت)/);
    if(sub)amount+= +sub[1]/100;
    else{
      const w=t.match(/و\s*([\u0621-\u064A ]{3,18}?)\s*(?:هللة|هلله|هللات|قرش|قروش|سنت)/);
      if(w){const key=w[1].trim();if(WORDS[key]!==undefined)amount+=WORDS[key]/100}
    }
    if(false){}
    else if(/\bونص\b|و\s*نصف/.test(t))amount+=0.5;
    else if(/وربع|و\s*ربع/.test(t))amount+=0.25;
    else if(/وتلت|وثلث/.test(t))amount+=Math.round(100/3)/100;
  }
  /* 5) العملة */
  let cur=settings.finCur||'SAR';
  if(/ريال|ر\.س|sar/i.test(t))cur='SAR';
  else if(/جنيه|ج\.م|egp/i.test(t))cur='EGP';
  else if(/دولار|\$|usd/i.test(t))cur='USD';
  /* 6) النوع */
  let kind='out';
  const isIn=/قبضت|استلمت|دخل|إيراد|ايراد|راتب|وصلني|حوّل\s*لي|حول لي|مقدم|دفعة من|تحصيل|بيع|أرباح|ارباح/.test(t);
  const isOut=/صرفت|دفعت|اشتريت|سددت|مصروف|خصم|اتخصم|شريت/.test(t);
  if(isIn)kind='in';
  if(/رصيدي|معي|عندي|الرصيد|الموجود/.test(t)&&!isIn&&!isOut)kind='set';
  /* 7) الحساب */
  let acct='كاش';
  if(/بنك|الحساب|حوالة|تحويل بنكي|راجحي|اهلي|الأهلي/.test(t))acct='بنك';
  else if(/كاش|نقدي|نقداً|نقدا/.test(t))acct='كاش';
  else if(/صراف|محفظة|مدى|فيزا|بطاقة|stc|أبل باي|ابل باي/.test(t))acct='الصرافة';
  const scope=/شركة|الشركة|مؤسسة|المؤسسة|الشغل|العميل|مشروع|إنتاج|انتاج|وزارة/.test(t)?'مؤسسة':'شخصي';
  /* 8) البند */
  let cat='';
  const CATS={'طعام':/أكل|اكل|طعام|طعم|مطعم|قهوة|كافيه|بقالة|سوبر ماركت|عشاء|غدا?ء|فطار/,
    'مواصلات':/بنزين|وقود|تاكسي|أوبر|اوبر|كريم|مواصلات|تذكرة|طيران|سفر|بترول/,
    'سكن':/إيجار|ايجار|سكن|كهرباء|مياه|فاتورة|فواتير|إنترنت|انترنت/,
    'معدات':/كاميرا|عدسة|ميكروفون|معدات|هارد|بطارية|إضاءة|اضاءة|تصوير|استوديو/,
    'رواتب':/راتب|رواتب|أجور|اجور|مكافأة|فريق|طاقم/,
    'صحة':/دواء|صيدلية|طبيب|علاج|مستشفى/,
    'اتصالات':/شحن|رصيد جوال|باقة|اتصالات|stc|موبايلي/};
  for(const k in CATS)if(CATS[k].test(t)){cat=k;break}
  return {id:uid(),kind,amount,cur,acct,scope,cat,note:raw.trim(),at,createdAt:Date.now(),updatedAt:Date.now()};
}
async function addFinText(raw,useAI){
  let tx=parseFin(raw);
  if(useAI&&settings.key){
    try{
      const out=await callAI({max:300,
        system:`حوّل الجملة المالية العربية إلى JSON فقط:
{"kind":"in|out|set","amount":0,"cur":"SAR|EGP|USD","acct":"بنك|كاش|الصرافة","scope":"شخصي|مؤسسة","cat":"بند مختصر","date":"YYYY-MM-DD","time":"HH:MM"}
تاريخ اليوم ${today()}. إن ذُكر تاريخ صريح أو نسبي (امبارح، من يومين، الأسبوع الماضي) فاحسبه وضعه في date، وإلا اترك date فارغاً.
لا تخلط أرقام التاريخ بالمبلغ. kind=set إذا كانت الجملة تقرير رصيد حالي. لا تكتب شيئاً غير JSON.`,
        prompt:raw});
      const j=JSON.parse(out.replace(/```json|```/g,'').trim());
      if(j&&j.amount){

        else if(tx)at=tx.at;
        tx={id:uid(),kind:j.kind||'out',amount:+j.amount,cur:j.cur||'SAR',acct:j.acct||'كاش',
          scope:j.scope||'شخصي',cat:j.cat||'',note:raw.trim(),at,createdAt:Date.now(),updatedAt:Date.now()};
      }
    }catch(e){}
  }
  if(!tx)return toast('ما لقيتش مبلغ في الجملة');
  if(!fin.accounts.includes(tx.acct))fin.accounts.push(tx.acct);
  fin.txs.unshift(tx);await finSave();renderFin();
  toast(`${tx.kind==='in'?'دخل':tx.kind==='set'?'رصيد':'مصروف'} ${fmtMoney(tx.amount)} ${CURN[tx.cur]} — ${tx.acct} · ${new Date(tx.at).toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}`);
}
/* --- الأرصدة --- */
function balances(scope){
  const b={};
  const list=[...fin.txs].filter(t=>scope==='الكل'||t.scope===scope).sort((a,b2)=>a.at-b2.at);
  list.forEach(t=>{
    const k=t.acct+'|'+t.cur;
    if(!(k in b))b[k]=0;
    if(t.kind==='set')b[k]=t.amount;
    else if(t.kind==='in')b[k]+=t.amount;
    else b[k]-=t.amount;
  });
  return b;
}
const fmtMoney=n=>{const r=Math.round(n*100)/100;
  return r.toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(r)?0:2,maximumFractionDigits:2})};
const fmtDT=ts=>new Date(ts).toLocaleDateString('ar-EG',{weekday:'short',day:'numeric',month:'short'})+' · '+
  new Date(ts).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
const toLocalInput=ts=>new Date(ts-new Date(ts).getTimezoneOffset()*60000).toISOString().slice(0,16);
function monthKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}

/* ===== الالتزامات الدورية والأقساط ===== */
function ensurePlans(){if(!fin.plans)fin.plans=[]}
const addMonths=(ts,n)=>{const d=new Date(ts);const day=d.getDate();d.setMonth(d.getMonth()+n);
  if(d.getDate()<day)d.setDate(0);return d.getTime()};
function planRemaining(p){
  if(!p.total)return null;
  return Math.max(0,p.total-(p.paid||0));
}
function planDue(p){/* مستحق أو فات موعده */
  return p.active!==false && p.next && p.next<=Date.now()+0 && (!p.total||(p.paid||0)<p.total);
}
function planSoon(p){
  return p.active!==false && p.next && p.next>Date.now() && p.next<Date.now()+3*86400000;
}
async function payPlan(p,skip){
  if(!skip){
    const tx={id:uid(),kind:'out',amount:p.amount,cur:p.cur,acct:p.acct,scope:p.scope,
      cat:p.cat||'التزامات',note:`${p.title}${p.total?` — قسط ${(p.paid||0)+1} من ${p.total}`:''}`,
      planId:p.id,at:p.next||Date.now(),createdAt:Date.now(),updatedAt:Date.now()};
    fin.txs.unshift(tx);
  }
  p.paid=(p.paid||0)+(skip?0:1);
  p.next=addMonths(p.next||Date.now(),p.every||1);
  if(p.total&&(p.paid||0)>=p.total)p.active=false;
  await finSave();renderFin();
  toast(skip?'اتأجل للشهر الجاي':`اتسجّل ${fmtMoney(p.amount)} ${CURN[p.cur]}${p.total?` — باقي ${p.total-p.paid} قسط`:''}`);
}

   <label class="f">الاسم</label><input class="inp" id="plT" value="${esc(p.title)}" placeholder="قسط جهاز التابلت">

     يُخصم تلقائياً من الحساب — سجّله بنفسك بلا سؤال</label>
   <p class="hint">مطفي = يسألك «اتدفع؟» في موعده. مشغّل = يتسجّل لوحده يوم الاستحقاق.</p>

    p.active=!(p.total&&p.paid>=p.total);p.updatedAt=Date.now();
    ensurePlans();if(!fin.plans.find(x=>x.id===p.id))fin.plans.unshift(p);
    if(!fin.accounts.includes(p.acct))fin.accounts.push(p.acct);

async function runAutoPlans(){
  ensurePlans();let did=0;
  for(const p of fin.plans){
    let guard=0;
    while(p.auto&&planDue(p)&&guard++<24){await payPlan(p,false);did++}
  }
  if(did)toast(`اتسجّل ${did} قسط تلقائي`);
}

          <span style="margin-inline-start:auto;direction:ltr;white-space:nowrap">${fmtMoney(p.amount)} ${CURN[p.cur]}</span>

      ${(()=>{const t={};act.forEach(p=>t[p.cur]=(t[p.cur]||0)+p.amount);
        return `<p class="hint" style="margin-top:10px">مرتبط شهرياً: ${Object.keys(t).map(c=>fmtMoney(t[c])+' '+CURN[c]).join(' · ')}</p>`})()}
    </div>`;
}

function renderFin(){
  if(!finLoaded)return finGate();
  ensurePlans();
  if(!renderFin._auto){renderFin._auto=true;setTimeout(runAutoPlans,300)}
  const b=balances(finScope);
  const keys=Object.keys(b);
  const mk=monthKey(Date.now());
  const mTx=fin.txs.filter(t=>monthKey(t.at)===mk&&(finScope==='الكل'||t.scope===finScope));
  const spent={},income={};
  mTx.forEach(t=>{if(t.kind==='out')spent[t.cur]=(spent[t.cur]||0)+t.amount;
    if(t.kind==='in')income[t.cur]=(income[t.cur]||0)+t.amount});
  const day=new Date().getDate();
  $('#paneFin').innerHTML=`
   <div class="scoperow">${['الكل','شخصي','مؤسسة'].map(x=>`<button class="vbtn ${finScope===x?'on':''}" data-scope="${x}">${x}</button>`).join('')}</div>
   <div class="capbox" style="margin-bottom:12px">
     <textarea id="finIn" rows="1" placeholder="مثال: صرفت ٣٠٠ ريال على بنزين من الصرافة — أو: امبارح دفعت ٥٠٠ إيجار" style="width:100%;border:none;outline:none;background:none;resize:none;min-height:40px"></textarea>
     <div class="caprow">

   </div>
   ${keys.length?`<div class="balgrid">${keys.map(k=>{const [a,c]=k.split('|');
     return `<div class="balcard"><b>${esc(a)} · ${CURN[c]}</b><div class="v ${b[k]<0?'neg':''}">${fmtMoney(b[k])}</div></div>`}).join('')}</div>`:''}
   ${plansHTML()}
   ${Object.keys(spent).length||Object.keys(income).length?`<div class="box" style="margin-bottom:12px">
     <b style="font-size:13px">هذا الشهر</b>
     ${Object.keys(income).map(c=>`<div style="display:flex;margin-top:4px"><span>دخل</span><span class="amt in" style="margin-inline-start:auto;direction:ltr;color:var(--done)">+${fmtMoney(income[c])} ${CURN[c]}</span></div>`).join('')}
     ${Object.keys(spent).map(c=>`<div style="display:flex;margin-top:4px"><span>مصروف</span><span style="margin-inline-start:auto;direction:ltr;color:var(--urgent)">−${fmtMoney(spent[c])} ${CURN[c]}</span></div>`).join('')}
     ${Object.keys(spent).map(c=>`<div style="display:flex;margin-top:4px;color:var(--ink-3);font-size:13px"><span>متوسط يومي</span><span style="margin-inline-start:auto;direction:ltr">${fmtMoney(spent[c]/day)} ${CURN[c]}</span></div>`).join('')}
   </div>`:''}
   <div class="mapbar">
     <button class="act pri" id="finRep">التقارير والجداول</button>
     <button class="act" id="planAdd">＋ التزام</button>
     <button class="act" id="finCsv">تصدير CSV</button>
     <button class="act" id="finLock">اقفل</button>
   </div>
   ${fin.txs.filter(t=>finScope==='الكل'||t.scope===finScope).slice(0,60).map(t=>`
     <div class="ftx" data-tx="${t.id}">
       <div style="min-width:0"><span>${esc(t.cat||(t.note||'').slice(0,30)||'معاملة')}</span>
         <small>${esc(t.acct)} · ${esc(t.scope)}${t.kind==='set'?' · تعيين رصيد':''}</small>
         <small>${fmtDT(t.at)}</small>
         ${t.note&&t.cat?`<small style="opacity:.75">${esc(t.note.slice(0,60))}</small>`:''}</div>
       <span class="amt ${t.kind==='in'?'in':t.kind==='out'?'out':''}">${t.kind==='in'?'+':t.kind==='out'?'−':'='}${fmtMoney(t.amount)} ${CURN[t.cur]}</span>
     </div>`).join('')||`<div class="empty"><div class="big">₪</div><p>لا معاملات بعد</p>
       <p style="font-size:13px">اكتب أو قل: «قبضت ٥٠٠٠ ريال راتب في البنك»</p></div>`}`;
  const ta=$('#finIn');
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,140)+'px'});
}
$('#paneFin').addEventListener('click',async e=>{
  const sc=e.target.closest('[data-scope]');
  if(sc){finScope=sc.dataset.scope;return renderFin()}
  const row=e.target.closest('[data-tx]');
  if(row){const t=fin.txs.find(x=>x.id===row.dataset.tx);if(t)return openTx(t)}
  if(e.target.id==='finAdd'){const v=$('#finIn').value.trim();if(!v)return;$('#finIn').value='';return addFinText(v,settings.finAI)}
  if(e.target.id==='finAI'){settings.finAI=!settings.finAI;saveSettings();renderFin();
    return toast(settings.finAI?'التحليل بالذكاء — تُرسل الجملة فقط':'تحليل محلي — لا يخرج شيء من جهازك')}
  if(e.target.id==='finLock'){finKey=null;finLoaded=false;fin={txs:[],plans:[],accounts:['بنك','كاش','الصرافة'],updatedAt:0};
    toast('اتقفل القسم المالي');return renderFin()}
  const pa=e.target.closest('[data-pact]');
  if(pa){
    const holder=pa.closest('[data-plan]');const p=(fin.plans||[]).find(x=>x.id===holder.dataset.plan);
    if(!p)return;
    if(pa.dataset.pact==='pay')return payPlan(p,false);
    if(pa.dataset.pact==='skip')return payPlan(p,true);
    if(pa.dataset.pact==='edit')return planEditor(p);
  }
  if(e.target.id==='planNew'||e.target.id==='planAdd')return planEditor(null);
  if(e.target.id==='finCsv')return finCsv();
  if(e.target.id==='finRep')return finReport();
});

function finCsv(){
  const rows=[['التاريخ','الوقت','النوع','المبلغ','العملة','الحساب','النطاق','البند','ملاحظات']];
  fin.txs.forEach(t=>rows.push([new Date(t.at).toISOString().slice(0,10),
    new Date(t.at).toTimeString().slice(0,5),
    t.kind==='in'?'دخل':t.kind==='set'?'رصيد':'مصروف',t.amount,t.cur,t.acct,t.scope,t.cat||'',(t.note||'').replace(/[\n,]/g,' ')]));
  download(`afkary-money-${today()}.csv`,'\ufeff'+rows.map(r=>r.join(',')).join('\n'),'text/csv');
  toast('نزل الجدول');
}
function finReport(){
  const mk=monthKey(Date.now());
  const prevD=new Date();prevD.setMonth(prevD.getMonth()-1);const pk=monthKey(prevD.getTime());
  const scopes=finScope==='الكل'?['شخصي','مؤسسة']:[finScope];
  let html='<h2>التقارير</h2>';
  scopes.forEach(sc=>{
    const cur=fin.txs.filter(t=>t.scope===sc&&monthKey(t.at)===mk);
    const prv=fin.txs.filter(t=>t.scope===sc&&monthKey(t.at)===pk);
    const byCat={};cur.filter(t=>t.kind==='out').forEach(t=>{
      const k=(t.cat||'غير مصنّف')+'|'+t.cur;byCat[k]=(byCat[k]||0)+t.amount});
    const inc={};cur.filter(t=>t.kind==='in').forEach(t=>{
      const k=(t.cat||'دخل')+'|'+t.cur;inc[k]=(inc[k]||0)+t.amount});
    const sum=(a,k)=>a.filter(t=>t.kind===k).reduce((x,t)=>x+t.amount,0);
    html+=`<h3>${sc}</h3>`;
    html+=Object.keys(byCat).length?`<table class="ftbl"><tr><th>بند المصروف</th><th class="num">المبلغ</th></tr>
      ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{const [c,cu]=k.split('|');
        return `<tr><td>${esc(c)}</td><td class="num">${fmtMoney(v)} ${CURN[cu]}</td></tr>`}).join('')}</table>`
      :'<p class="hint">لا مصروفات هذا الشهر</p>';
    html+=Object.keys(inc).length?`<table class="ftbl"><tr><th>مصدر الدخل</th><th class="num">المبلغ</th></tr>
      ${Object.entries(inc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{const [c,cu]=k.split('|');
        return `<tr><td>${esc(c)}</td><td class="num">${fmtMoney(v)} ${CURN[cu]}</td></tr>`}).join('')}</table>`:'';
    const c1=sum(cur,'out'),p1=sum(prv,'out');
    html+=`<p class="hint">إنفاق الشهر: ${fmtMoney(c1)} · الشهر الماضي: ${fmtMoney(p1)}${p1?` · التغيّر ${c1>p1?'+':''}${Math.round((c1-p1)/p1*100)}%`:''}</p>`;
  });
  const pl=(fin.plans||[]).filter(p=>p.active!==false);
  if(pl.length){
    html+='<h3>الالتزامات الشهرية</h3><table class="ftbl"><tr><th>الالتزام</th><th>الموعد</th><th class="num">المبلغ</th></tr>'+
      pl.map(p=>`<tr><td>${esc(p.title)}${p.total?` <span style="color:var(--ink-3)">(باقي ${planRemaining(p)})</span>`:''}</td>
        <td>${new Date(p.next).toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}</td>
        <td class="num">${fmtMoney(p.amount)} ${CURN[p.cur]}</td></tr>`).join('')+'</table>';
    const tot={};pl.forEach(p=>tot[p.cur]=(tot[p.cur]||0)+p.amount);
    const rem={};pl.filter(p=>p.total).forEach(p=>rem[p.cur]=(rem[p.cur]||0)+planRemaining(p)*p.amount);
    html+=`<p class="hint">إجمالي شهري: ${Object.keys(tot).map(c=>fmtMoney(tot[c])+' '+CURN[c]).join(' · ')}`+
      (Object.keys(rem).length?` · إجمالي المتبقي على الأقساط: ${Object.keys(rem).map(c=>fmtMoney(rem[c])+' '+CURN[c]).join(' · ')}`:'')+'</p>';
  }
  html+='<button class="btn sec" id="repCsv">تصدير CSV</button>';
  openSheet(html);
  $('#repCsv').onclick=finCsv;
}

  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    return toast('المتصفح لا يدعم التسجيل — استخدم رفع ملف');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const types=['audio/mp4','audio/webm;codecs=opus','audio/webm',''];
    const mime=types.find(t=>!t||(window.MediaRecorder&&MediaRecorder.isTypeSupported(t)))||'';
    mediaRec=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:{});
    chunks=[];recSecs=0;recTitle=$('#rTitle').value.trim();
    mediaRec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data)};
    mediaRec.onstop=async()=>{
      clearInterval(recTimer);
      keepAwake(false);
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:mediaRec.mimeType||'audio/mp4'});
      mediaRec=null;chunks=[];
      $('#rec').classList.remove('on');
      await processAudio(blob,recTitle,recSecs);
    };

    $('#rBtn').classList.add('rec');$('#rIcon').textContent='■';$('#rState').textContent='يسجّل… اضغط للإيقاف';

async function processAudio(blob,title,dur){

  const mb=blob.size/1048576;

  const m={id:uid(),title:title||'اجتماع '+new Date().toLocaleDateString('ar-EG'),
    createdAt:Date.now(),updatedAt:Date.now(),dur,transcript:'',summary:'',decisions:[],questions:[],extracted:false};

      system:`فرّغ التسجيل الصوتي نصاً بالعربية كما هو دون تلخيص ودون إضافة.

const pad=$('#pad'),ctx=pad.getContext('2d');
let strokes=[],cur=null,penOnly=false,erasing=false,color='#181C1B',size=2,editB=null;
function fitCanvas(){
  const r=pad.parentElement.getBoundingClientRect();
  if(r.width<10||r.height<10)return setTimeout(fitCanvas,120);
  const dpr=Math.min(devicePixelRatio||1,2.5);
  pad.width=Math.round(r.width*dpr);pad.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);redraw();
}
function redraw(){
  const r=pad.parentElement.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const s of strokes){ctx.beginPath();ctx.strokeStyle=s.erase?'#fff':s.color;
    s.pts.forEach((p,i)=>{ctx.lineWidth=(s.erase?s.size*5:s.size)*(p.p?(.55+p.p*.9):1);
      i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.stroke()}
}
const posOf=e=>{const r=pad.getBoundingClientRect();
  return{x:e.clientX-r.left,y:e.clientY-r.top,p:(e.pressure>0&&e.pressure<1)?e.pressure:null}};
pad.addEventListener('pointerdown',e=>{if(penOnly&&e.pointerType==='touch')return;
  e.preventDefault();pad.setPointerCapture(e.pointerId);
  cur={color,size,erase:erasing,pts:[posOf(e)]};strokes.push(cur);redraw()});
pad.addEventListener('pointermove',e=>{if(!cur||(penOnly&&e.pointerType==='touch'))return;e.preventDefault();
  (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>cur.pts.push(posOf(ev)));redraw()});
['pointerup','pointercancel','pointerleave'].forEach(t=>pad.addEventListener(t,()=>{cur=null}));

  const L=(t,a)=>a&&a.length?`${t}: ${a.join('، ')}\n`:'';
  return (prof.summary||(prof.projects||[]).length||(prof.goals||[]).length)
    ?`— ملف المستخدم —\n${prof.summary?prof.summary+'\n':''}${L('مشاريعه',prof.projects)}${L('أهدافه',prof.goals)}${L('أشخاص حوله',prof.people)}${prof.style?'أسلوبه: '+prof.style+'\n':''}`:'';
}
function contextBlock(){
  const open=notes.filter(n=>!n.private&&n.status==='open').slice(0,120);
  const done=notes.filter(n=>!n.private&&n.status==='done').slice(0,20);
  const line=n=>`- [${n.type}/${n.priority}${n.cat?'/'+n.cat:''}] ${n.text.replace(/\n/g,' ')} (${fmtDate(n.createdAt)})`;
  const jl=journals.slice(0,5).map(j=>`- ${j.title||'مذكرة'} (${fmtDate(j.createdAt)}): ${(j.body||'').slice(0,150)}`).join('\n');
  const ml=meetings.slice(0,5).map(m=>`- ${m.title||'اجتماع'} (${fmtDate(m.createdAt)}): ${(m.summary||'').slice(0,180)}`).join('\n');
  return `${profText()}\nالملاحظات المفتوحة:\n${open.map(line).join('\n')||'(لا شيء)'}\n\nالمنجز مؤخراً:\n${done.map(line).join('\n')||'(لا شيء)'}${jl?'\n\nمذكرات أخيرة:\n'+jl:''}${ml?'\n\nاجتماعات أخيرة:\n'+ml:''}`;
}
async function runBrief(force){
  if(!settings.key)return force?openSettings('الموجز يحتاج مفتاحاً'):undefined;
  if(!force&&(!settings.autoBrief||brief.date===today()))return;
  if(!notes.filter(n=>!n.private&&n.status==='open').length)return;
  try{
    const out=await callAI({deep:true,
      system:`أنت مساعد تنفيذي عربي. اكتب موجزاً صباحياً قصيراً جداً بالعربية المصرية:
سطر أول: ابدأ بإيه النهاردة ولماذا. ثم سطران: ما تأخر ويحتاج حسماً. ثم سطر: ربط أو ملاحظة لافتة بين أفكاره.
٦ أسطر كحد أقصى، بلا عناوين ولا مقدمات ولا مجاملات.`,
      prompt:contextBlock(),max:600});
    brief={date:today(),text:out};store.set('afk_brief',brief);renderNotes();
    if(force)toast('جهّزت الموجز');
  }catch(e){if(force)toast('تعذّر: '+e.message)}
}
$('#btnAnalyze').onclick=runSession;
function newThread(title,firstAi){
  const t={id:uid(),title,msgs:firstAi?[{r:'ai',t:firstAi}]:[],createdAt:Date.now(),updatedAt:Date.now()};
  threads.unshift(t);curThread=t.id;save();return t;
}
async function runSession(){
  if(!settings.key)return openSettings('جلسة التحليل تحتاج مفتاحاً');
  if(!notes.filter(n=>!n.private).length)return toast('اكتب بعض الملاحظات أولاً');
  const t=newThread('جلسة تحليل — '+new Date().toLocaleDateString('ar-EG'));
  go('chat');
  const th=pushRaw('<span class="dot"></span><span class="dot"></span><span class="dot"></span>');
  try{
    const out=await callAI({deep:true,system:`أنت مستشار تنفيذي عربي يقرأ دفتر أفكار صاحبه. بالعربية المصرية، بلا مجاملات ولا مقدمات.
اكتب تقريراً قصيراً بالعناوين دي:
■ ابدأ بإيه النهاردة — ٣ بنود بالترتيب مع سبب سطر لكل بند
■ أفكار متقاطعة — أفكار متباعدة بينها رابط حقيقي وإيه اللي ممكن يطلع منها
■ مجموعات — محاور بأسمائها
■ ممكن يتأجل — وليه
■ لو أنا مكانك — اقتراح واحد جريء قابل للتنفيذ
وفي آخر ردك ضع كتلة JSON بين \`\`\`json و \`\`\` بالشكل:
{"summary":"من هو صاحب الدفتر في سطرين","projects":[],"goals":[],"people":[],"style":"أسلوبه"}`,
      prompt:contextBlock(),max:2400});
    th.remove();
    const m=out.match(/```json([\s\S]*?)```/);
    let text=out;
    if(m){try{const j=JSON.parse(m[1].trim());
      prof={summary:j.summary||prof.summary,projects:j.projects||prof.projects,goals:j.goals||prof.goals,
        people:[...new Set([...(prof.people||[]),...(j.people||[])])].slice(0,25),style:j.style||prof.style,at:Date.now()};
      text=out.replace(m[0],'').trim()}catch(e){}}
    t.msgs.push({r:'ai',t:text});t.updatedAt=Date.now();save();renderChat();
  }catch(e){th.remove();t.msgs.push({r:'sys',t:'تعذّرت الجلسة: '+e.message});save();renderChat()}
}
const QUICK=['ابدأ بإيه النهاردة؟','اعملي خطة للأسبوع','دوّر في ملاحظاتي عن…','حوّل أفكاري لخطوات','إيه اللي اتأخر عليّ؟','ابحث في النت عن…'];
const thread=()=>threads.find(t=>t.id===curThread);
function renderChat(){
  $('#quickAsk').innerHTML=QUICK.map(q=>`<button class="qchip">${q}</button>`).join('');
  const t=thread();
  $('#chatLog').innerHTML=(t&&t.msgs.length)?t.msgs.map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join('')
   :`<div class="empty" style="padding:30px 10px"><div class="big">✧</div><p>اسأل عن ملاحظاتك، أو اطلب خطة</p>
     <p style="font-size:13px">المساعد شايف ملاحظاتك ومذكراتك وملف شخصيتك</p></div>`;
  const l=$('#chatLog').lastElementChild;if(l)l.scrollIntoView({block:'end'});
}
$('#quickAsk').addEventListener('click',e=>{const b=e.target.closest('.qchip');if(!b)return;
  $('#askInput').value=b.textContent.replace('…','');$('#askInput').focus()});
function pushRaw(html){const d=document.createElement('div');d.className='msg ai';d.innerHTML=html;
  $('#chatLog').appendChild(d);d.scrollIntoView({block:'end'});return d}
$('#askSend').onclick=ask;
$('#askInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();ask()}});
async function ask(){
  const q=$('#askInput').value.trim();if(!q)return;
  $('#askInput').value='';
  let t=thread();
  if(!t)t=newThread(q.slice(0,30));
  t.msgs.push({r:'me',t:q});t.updatedAt=Date.now();save();renderChat();
  if(/رصيد|رصيدي|فلوس|مصروف|إنفاق|انفاق|صرفت|دخل|مصاريف/.test(q)&&finLoaded){
    const b=balances('الكل'),mk=monthKey(Date.now());
    const mt=fin.txs.filter(t=>monthKey(t.at)===mk);
    const sp={},ic={};
    mt.forEach(t=>{if(t.kind==='out')sp[t.cur]=(sp[t.cur]||0)+t.amount;if(t.kind==='in')ic[t.cur]=(ic[t.cur]||0)+t.amount});
    const day=new Date().getDate();
    let r='الأرصدة:\n'+Object.keys(b).map(k=>{const [a,c]=k.split('|');return `• ${a} — ${fmtMoney(b[k])} ${CURN[c]}`}).join('\n');
    r+='\n\nهذا الشهر:\n'+Object.keys(ic).map(c=>`• دخل: ${fmtMoney(ic[c])} ${CURN[c]}`).join('\n');
    r+='\n'+Object.keys(sp).map(c=>`• مصروف: ${fmtMoney(sp[c])} ${CURN[c]} (متوسط يومي ${fmtMoney(sp[c]/day)})`).join('\n');
    r+='\n\n(محسوبة على جهازك — لم تُرسل أي أرقام)';
    t.msgs.push({r:'ai',t:r});save();renderChat();return;
  }
  if(/^(دور|دوّر|ابحث|فين|لاقي)/.test(q)&&!/نت|الإنترنت|الانترنت|جوجل|النت/.test(q)){
    const term=q.replace(/^(دور|دوّر|ابحث|فين|لاقي)\s*(في ملاحظاتي)?\s*(عن)?\s*/,'').trim();
    const hits=notes.filter(n=>n.text.includes(term));
    if(hits.length){t.msgs.push({r:'ai',t:`لقيت ${hits.length}:\n\n`+hits.slice(0,12).map(n=>`• [${n.type}] ${n.text}`).join('\n')});
      save();renderChat();return}
  }
  if(!settings.key){t.msgs.push({r:'sys',t:'البحث المحلي شغال. للأسئلة المفتوحة أضف مفتاحاً.'});save();renderChat();return}
  const th=pushRaw('<span class="dot"></span><span class="dot"></span><span class="dot"></span>');
  try{
    const hist=t.msgs.slice(-10).map(m=>`${m.r==='me'?'أنا':'أنت'}: ${m.t}`).join('\n');
    const out=await callAI({deep:true,web:true,
      system:`أنت مساعد شخصي عربي لصاحب هذا الدفتر. رد بالعربية المصرية، مختصر وعملي بلا مقدمات.\n\n${contextBlock()}\n\nسياق المحادثة:\n${hist}`,
      prompt:q,max:1800});
    th.remove();t.msgs.push({r:'ai',t:out});t.updatedAt=Date.now();save();renderChat();
  }catch(e){th.remove();t.msgs.push({r:'sys',t:'تعذّر: '+e.message});save();renderChat()}
}

$('#sheet').addEventListener('click',e=>{if(e.target.dataset.close!==undefined)$('#sheet').classList.remove('on')});

   <label class="f" style="display:flex;align-items:center;gap:9px">

   <select class="inp" id="sProv">${Object.keys(PROVIDERS).map(k=>`<option value="${k}" ${settings.provider===k?'selected':''}>${PROVIDERS[k].name}</option>`).join('')}</select>
   <label class="f">المفتاح</label>

     <a href="${p.keyUrl}" target="_blank" rel="noopener">احصل على مفتاح ${p.name}</a></p>
   <label class="f">نموذج التحليل العميق (فاضي = ${p.def})</label>
   <input class="inp" id="sModel" placeholder="${p.def}" value="${esc(settings.model)}">
   <label class="f">نموذج المهام السريعة</label>

   <label class="f" style="display:flex;align-items:center;gap:9px">
     <input type="checkbox" id="sAuto" ${settings.autoAI?'checked':''} style="width:18px;height:18px"> تصنيف كل ملاحظة لحظة كتابتها</label>
   <label class="f" style="display:flex;align-items:center;gap:9px">
     <input type="checkbox" id="sBrief" ${settings.autoBrief?'checked':''} style="width:18px;height:18px"> موجز صباحي تلقائي كل يوم</label>
   <label class="f" style="display:flex;align-items:center;gap:9px">
     <input type="checkbox" id="sWeb" ${settings.web?'checked':''} style="width:18px;height:18px"> بحث في الإنترنت داخل المساعد</label>
   <p class="hint">البحث مدعوم مع Gemini؛ مع غيره يُتجاهل.</p>
   <div class="rowbtns"><button class="btn row sec" id="sTest">اختبر الاتصال</button>
     <button class="btn row" id="sSave">حفظ</button></div>

   <h3>بياناتك</h3>
   <div class="rowbtns"><button class="btn row sec" id="xJson">نسخة احتياطية</button>
     <button class="btn row sec" id="xMd">تصدير Markdown</button></div>
   <div class="rowbtns"><button class="btn row sec" id="xImport">استيراد نسخة</button>
     <button class="btn row sec" id="xBulk">استيراد ملاحظات قديمة</button></div>
   <button class="btn sec" id="xNotify">تفعيل تنبيهات المهام</button>
   <button class="btn danger" id="xWipe">مسح كل شيء من هذا الجهاز</button>
   <input type="file" id="fileIn" accept="application/json" hidden>`);
  const pull=()=>{settings.key=$('#sKey').value.trim();settings.model=$('#sModel').value.trim();

    settings.web=$('#sWeb').checked;settings.autoSync=$('#ghAuto').checked;saveSettings();
    $('#sheet').classList.remove('on');toast('اتحفظت الإعدادات')};
  $('#sTest').onclick=async e=>{pull();e.target.textContent='جارٍ…';
    try{await callAI({deep:true,system:'أجب بكلمة واحدة.',prompt:'قل: تمام',max:20});e.target.textContent='الاتصال شغال ✓'}
    catch(err){e.target.textContent='فشل';toast(err.message)}};
  $('#ghTest').onclick=async e=>{pull();e.target.textContent='جارٍ…';
    try{await ghRead('afkary-data.json');e.target.textContent='الربط شغال ✓'}
    catch(err){e.target.textContent='فشل';toast(err.message)}};

function download(n,c,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));
  a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function exportJson(){download(`afkary-${today()}.json`,
  JSON.stringify({v:3,notes,boards,journals,threads,meetings,prof,exportedAt:Date.now()},null,2),'application/json');
  toast('نزلت النسخة — بلا مفاتيح')}
function exportMd(){
  const by=t=>notes.filter(n=>n.status!=='done'&&n.priority===t);
  const L=n=>`- ${n.text.replace(/\n/g,' ')}${n.cat?' _('+n.cat+')_':''}`;
  download(`afkary-${today()}.md`,
   `# أفكاري — ${new Date().toLocaleDateString('ar-EG')}\n\n## عاجل\n${by('عاجل').map(L).join('\n')||'—'}\n\n## قيد التنفيذ\n${by('مهم').map(L).join('\n')||'—'}\n\n## مؤجل\n${by('مؤجل').map(L).join('\n')||'—'}\n\n## منجز\n${notes.filter(n=>n.status==='done').map(L).join('\n')||'—'}\n\n# مذكرات\n${journals.map(j=>`\n## ${j.title||'بلا عنوان'}\n${j.body}`).join('\n')}\n\n# اجتماعات\n${meetings.map(m=>`\n## ${m.title||'اجتماع'}\n${m.summary||''}\n\n${m.transcript||''}`).join('\n')}`,
   'text/markdown')}
function importJson(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    notes=mergeById(notes,d.notes||[]);boards=mergeById(boards,d.boards||[]);
    journals=mergeById(journals,d.journals||[]);threads=mergeById(threads,d.threads||[]);
    meetings=mergeById(meetings,d.meetings||[]);
    if(d.prof&&(d.prof.at||0)>(prof.at||0))prof=d.prof;
    save();mnodes=[];$('#sheet').classList.remove('on');go('notes');toast('تم الدمج بلا تكرار')}
    catch(err){toast('ملف غير صالح')}};r.readAsText(f)}
function bulkImport(){
  openSheet(`<h2>استيراد ملاحظات قديمة</h2>
   <p class="hint">الصق ملاحظاتك — كل سطر يتحوّل لملاحظة ويُصنَّف تلقائياً.</p>
   <textarea class="inp" id="bulkTxt" style="min-height:200px" placeholder="سطر لكل ملاحظة…"></textarea>
   <button class="btn" id="bulkGo">استورد وصنّف</button>`);
  $('#bulkGo').onclick=()=>{const l=$('#bulkTxt').value.split('\n').map(s=>s.trim()).filter(s=>s.length>1);
    l.reverse().forEach(x=>addNote(x));save();mnodes=[];$('#sheet').classList.remove('on');go('notes');
    toast(`اتضافت ${l.length} ملاحظة`)};
}
function checkDue(){if(!('Notification'in window)||Notification.permission!=='granted')return;
  const s=staleTasks();if(s.length)new Notification('أفكاري',{body:`${s.length} مهام متأخرة — أولها: ${s[0].text.slice(0,50)}`});
  if(finLoaded&&fin.plans){
    const d=fin.plans.filter(p=>p.active!==false&&!p.auto&&(planDue(p)||planSoon(p)));
    if(d.length)new Notification('أفكاري — التزامات',{body:d.map(p=>`${p.title}: ${fmtMoney(p.amount)} ${CURN[p.cur]}`).join(' · ')});
  }}
